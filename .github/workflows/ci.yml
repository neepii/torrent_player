name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv

      - name: Format check
        run: go fmt ./...

      - name: Lint check
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...
