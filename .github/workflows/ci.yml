name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Format check
        run: go fmt ./... && git diff --exit-code

      - name: Lint check
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
